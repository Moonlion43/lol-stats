{# Combined statistics table partial. #}
<table>
  <thead>
    <tr>
      <th scope="col">Games</th>
      <th scope="col">Wins</th>
      <th scope="col">Kills</th>
      <th scope="col">Deaths</th>
      <th scope="col">Assists</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>{{ stats.games }}</td>
      <td>{{ stats.wins }}</td>
      <td>{{ stats.kills }}</td>
      <td>{{ stats.deaths }}</td>
      <td>{{ stats.assists }}</td>
    </tr>
  </tbody>
</table>
